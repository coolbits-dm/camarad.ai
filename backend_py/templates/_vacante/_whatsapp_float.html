{# Floating WhatsApp button. Only renders when mwr_whatsapp_url is non-empty
   (the backend empties it when it contains the XXXX placeholder). #}
{% if mwr_whatsapp_url %}
<a href="{{ mwr_whatsapp_url }}"
   target="_blank"
   rel="noopener noreferrer"
   id="vac-wa"
   class="vac-wa"
   data-cta="whatsapp_float"
   aria-label="Scrie-mi pe WhatsApp">
  <svg width="28" height="28" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
    <path d="M20.5 3.5A11 11 0 0 0 3.1 17.3L2 22l4.8-1.1A11 11 0 1 0 20.5 3.5Zm-8.5 17a8.6 8.6 0 0 1-4.4-1.2l-.3-.2-2.8.7.8-2.7-.2-.3A8.6 8.6 0 1 1 12 20.5Zm4.9-6.3c-.3-.2-1.6-.8-1.8-.9-.2-.1-.4-.1-.6.1-.2.3-.7.9-.8 1-.2.2-.3.2-.6 0a7 7 0 0 1-3.5-3c-.3-.4.3-.4.8-1.3.1-.2 0-.4 0-.5 0-.1-.6-1.4-.8-1.9-.2-.5-.4-.4-.6-.4H8c-.2 0-.5.1-.7.3-.2.3-.9.9-.9 2.2s.9 2.6 1 2.8c.1.2 1.8 2.8 4.4 3.9 1.6.6 2.2.7 3 .6.5-.1 1.6-.7 1.8-1.3.2-.6.2-1.1.2-1.3-.1-.1-.2-.2-.5-.3Z"/>
  </svg>
  <span class="vac-wa__label">WhatsApp</span>
</a>
<style>
  .vac-wa{
    position:fixed;right:20px;bottom:24px;z-index:49;
    display:inline-flex;align-items:center;gap:.55rem;
    padding:12px 16px 12px 14px;border-radius:999px;
    background:#25D366;color:#fff;text-decoration:none;
    font-family:"Manrope","Segoe UI",sans-serif;font-weight:700;font-size:.95rem;
    box-shadow:0 10px 24px rgba(18,18,18,.18);
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .vac-wa:hover{transform:translateY(-1px);box-shadow:0 14px 30px rgba(18,18,18,.22);}
  /* On mobile, avoid overlap with the sticky CTA bar */
  @media (max-width:768px){
    .vac-wa{bottom:86px;padding:10px;gap:0;}
    .vac-wa__label{display:none;}
  }
</style>
{% endif %}
